# 검사(모든 push·PR) + 릴리즈 빌드(v* 태그)
#
# 보안:
# - 외부 액션은 태그 대신 커밋 해시로 고정한다 (태그가 바뀌어도 빌드에 다른 코드가 섞이지 않게).
# - 기본 권한은 읽기 전용, 릴리즈를 올리는 job만 contents: write.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: 의존성 설치 (uv.lock 그대로)
        run: uv sync --locked
      - name: 린트
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: 테스트
        run: uv run pytest -q
      - name: 의존성 취약점 점검
        run: uv run pip-audit --skip-editable

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write # 릴리즈 업로드에만 필요
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - name: exe 빌드 (+ SHA256, 배포용 zip)
        run: uv run python tools/build.py
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/StickyTodo.exe
            dist/StickyTodo.exe.sha256
            dist/StickyTodo-*.zip
