# 검사(모든 push·PR) + 릴리즈 빌드(v* 태그)
#
# 보안:
# - 외부 액션은 태그 대신 커밋 해시로 고정한다 (태그가 바뀌어도 빌드에 다른 코드가 섞이지 않게).
# - 기본 권한은 읽기 전용, 릴리즈를 올리는 job만 contents: write.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1" # 영어 윈도우 서버에서도 한글 출력이 깨지거나 실패하지 않게

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: 의존성 설치 (uv.lock 그대로)
        run: uv sync --locked
      - name: 린트
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: 테스트
        run: uv run pytest -q --junitxml=pytest-report.xml
      - name: 실패한 테스트를 annotation으로 남기기
        if: failure()
        run: uv run python tools/ci_annotate.py pytest-report.xml
      - name: 의존성 취약점 점검
        run: uv run pip-audit --skip-editable

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write # 릴리즈 업로드에만 필요
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - name: Inno Setup 6.7.3 설치 (공식 릴리즈 파일, SHA256 확인 후)
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $expected = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
          $file = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $file
          $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "Inno Setup 설치 파일 해시 불일치: $actual" }
          Start-Process -FilePath $file -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER" -Wait
      - name: exe + 설치 프로그램 빌드 (+ SHA256, 배포용 zip)
        run: uv run python tools/build.py --installer
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/StickyTodo-Setup.exe
            dist/StickyTodo-Setup.exe.sha256
            dist/StickyTodo.exe
            dist/StickyTodo.exe.sha256
            dist/StickyTodo-*.zip
