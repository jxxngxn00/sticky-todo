[project]
name = "sticky-todo"
version = "0.1.1"
description = "윈도우 바탕화면 스티키 노트 할 일 위젯"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyside6-essentials==6.12.0",
]

[project.scripts]
sticky-todo = "sticky_todo.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sticky_todo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[dependency-groups]
dev = [
    "pip-audit==2.10.1",
    "pyinstaller==6.22.3",
    "pytest==9.2.0",
    "ruff==0.17.6",
]
